<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday to Jin En</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        :root {
            --bg-color: #0F2E22;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --accent-color: #4ade80;
            --transition-speed: 0.8s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #app {
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* Screen Management */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-speed) ease, visibility var(--transition-speed);
            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        /* Glassmorphism */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }

        /* Page 1: Password Screen */
        .split-layout {
            display: flex;
            width: 90%;
            max-width: 1200px;
            height: 80%;
            align-items: center;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .split-layout {
                flex-direction: column;
                width: 95%;
                height: 90%;
                gap: 10px;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .split-layout {
                gap: 5px;
                width: 100%;
                padding: 0 10px;
            }
        }

        .left-side, .right-side {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .polaroid-hero {
            max-width: 100%;
            max-height: 600px;
        }

        .login-container {
            padding: 40px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 15px 10px;
            }
        }

        .hint-container {
            margin-top: 20px;
        }

        .text-button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .text-button:hover {
            color: white;
        }

        #hint-text {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--accent-color);
            transition: opacity 0.5s ease;
        }

        #hint-text.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.4rem;
                margin-bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.1rem;
                margin-bottom: 15px;
            }
        }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .dots-container {
                gap: 12px;
                margin-bottom: 25px;
            }

            .dot {
                width: 14px;
                height: 14px;
            }
        }

        @media (max-width: 480px) {
            .dots-container {
                gap: 10px;
                margin-bottom: 20px;
            }

            .dot {
                width: 12px;
                height: 12px;
            }
        }

        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .dot.active {
            background: var(--text-color);
            transform: scale(1.2);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            justify-items: center;
        }

        @media (max-width: 768px) {
            .keypad {
                gap: 14px;
            }
        }

        @media (max-width: 480px) {
            .keypad {
                gap: 10px;
            }
        }

        @media (max-width: 380px) {
            .keypad {
                gap: 8px;
            }
        }

        .key {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        @media (max-width: 768px) {
            .key {
                width: 64px;
                height: 64px;
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .key {
                width: 56px;
                height: 56px;
                font-size: 1.1rem;
            }
        }

        @media (max-width: 380px) {
            .key {
                width: 48px;
                height: 48px;
                font-size: 1rem;
            }
        }

        .key:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .key:active {
            background: rgba(255,255,255,0.4);
            transform: scale(0.95);
        }

        /* Loading Screen */
        .loading-content {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        @media (max-width: 768px) {
            .loading-content {
                max-width: 280px;
            }
        }

        .loading-content h2 {
            font-weight: 300;
            margin-bottom: 20px;
        }

        .progress-container {
            height: 8px;
            width: 100%;
            overflow: hidden;
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .progress-container {
                height: 6px;
            }
        }

        @media (max-width: 480px) {
            .progress-container {
                height: 5px;
            }
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-color);
            border-radius: 4px;
        }

        /* Page 2: Envelope */
        .envelope-container {
            text-align: center;
            cursor: pointer;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .envelope-container {
                gap: 14px;
                padding: 10px;
            }
        }

        #envelope-img {
            max-width: 300px;
            width: 100%;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @media (max-width: 768px) {
            #envelope-img {
                max-width: 220px;
            }

            .label {
                font-size: 1rem;
                margin-top: 15px;
            }
        }

        @media (max-width: 480px) {
            #envelope-img {
                max-width: 180px;
            }

            .label {
                font-size: 0.9rem;
                margin-top: 12px;
            }
        }

        /* On mobile, envelope nav sits in the flow for centering */
        @media (max-width: 768px) {
            .envelope-nav {
                position: static;
                transform: none;
                bottom: auto;
                left: auto;
            }
        }

        .envelope-container:hover #envelope-img {
            transform: scale(1.05);
        }

        .envelope-container.opening #envelope-img {
            animation: openEnvelope 0.6s forwards;
        }

        @keyframes openEnvelope {
            0% { transform: scale(1); }
            40% { transform: scale(0.9); }
            100% { transform: scale(1.5) rotate(5deg); opacity: 0; }
        }

        .label {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.8;
        }

        /* Page 3: Letter and Photos */
        .scrapbook-container {
            position: relative;
            width: 95%;
            height: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 768px) {
            .scrapbook-container {
                width: 100%;
                height: auto;
                min-height: 85%;
                flex-direction: column;
                gap: 6px;
                padding: 8px 5px;
                overflow-y: auto;
            }

            .bday-card {
                max-width: 70vw;
                max-height: 55vh;
            }
        }

        .main-card-wrapper {
            z-index: 10;
            transform: scale(0);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .screen.active .main-card-wrapper {
            transform: scale(1);
        }

        .bday-card {
            max-width: 500px;
            max-height: 70vh;
            width: 100%;
        }

        @media (max-width: 768px) {
            .bday-card {
                max-width: 85vw;
                max-height: 60vh;
            }
        }

        @media (max-width: 480px) {
            .bday-card {
                max-width: 80vw;
                max-height: 50vh;
            }

            .scattered-photo {
                max-width: 45px !important;
            }

            .photos-left, .photos-right {
                gap: 6px;
            }
        }

        @media (max-width: 380px) {
            .scattered-photo {
                max-width: 38px !important;
            }
        }

        .photos-left, .photos-right {
            position: absolute;
            top: 0;
            height: 100%;
            width: 30%;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .photos-left, .photos-right {
                width: 25%;
            }

            .scattered-photo {
                max-width: 80px;
            }
        }

        @media (max-width: 480px) {
            .photos-left, .photos-right {
                width: 20%;
            }

            .scattered-photo {
                max-width: 60px;
            }
        }

        @media (max-width: 380px) {
            .scattered-photo {
                max-width: 50px;
            }
        }

        .photos-left { left: 0; }
        .photos-right { right: 0; }

        .scattered-photo {
            position: absolute;
            max-width: 200px;
            opacity: 0;
            transition: all 1s ease-out;
        }

        .screen.active .scattered-photo {
            opacity: 1;
        }

        /* Individual photo positions - Ensuring pairs are not horizontally aligned */
        .photo-1 { top: 12%; left: 8%; transform: rotate(-5deg) translateY(50px); transition-delay: 0.8s; }
        .photo-2 { top: 22%; right: 10%; transform: rotate(4deg) translateY(50px); transition-delay: 1.1s; }
        .photo-3 { top: 45%; left: 5%; transform: rotate(7deg) translateY(50px); transition-delay: 1.4s; }
        .photo-4 { top: 35%; right: 5%; transform: rotate(-6deg) translateY(50px); transition-delay: 1.7s; }
        .photo-5 { bottom: 8%; left: 12%; transform: rotate(-3deg) translateY(50px); transition-delay: 2.0s; }
        .photo-6 { bottom: 18%; right: 15%; transform: rotate(5deg) translateY(50px); transition-delay: 2.3s; }

        @media (max-width: 768px) {
            .photo-1 { top: 8%; left: 4%; }
            .photo-2 { top: 5%; right: 4%; }
            .photo-3 { top: 42%; left: 3%; }
            .photo-4 { top: 38%; right: 3%; }
            .photo-5 { bottom: 5%; left: 6%; }
            .photo-6 { bottom: 10%; right: 8%; }
        }

        @media (max-width: 480px) {
            .photo-1 { top: 3%; left: 2%; }
            .photo-2 { top: 2%; right: 2%; }
            .photo-3 { top: 40%; left: 1%; }
            .photo-4 { top: 36%; right: 1%; }
            .photo-5 { bottom: 2%; left: 3%; }
            .photo-6 { bottom: 5%; right: 4%; }
        }

        .screen.active .photo-1 { transform: rotate(-5deg) translateY(0); }
        .screen.active .photo-2 { transform: rotate(4deg) translateY(0); }
        .screen.active .photo-3 { transform: rotate(7deg) translateY(0); }
        .screen.active .photo-4 { transform: rotate(-6deg) translateY(0); }
        .screen.active .photo-5 { transform: rotate(-3deg) translateY(0); }
        .screen.active .photo-6 { transform: rotate(5deg) translateY(0); }

        /* Mobile: restructure scrapbook into vertical stack (photos above & below card) */
        @media (max-width: 768px) {
            .photos-left, .photos-right {
                position: static !important;
                width: 100% !important;
                height: auto !important;
                display: flex !important;
                flex-direction: row !important;
                justify-content: center !important;
                gap: 8px;
                pointer-events: none;
            }

            .photos-left {
                order: 0;
            }

            .main-card-wrapper {
                order: 1;
                flex-shrink: 0;
            }

            .photos-right {
                order: 2;
            }

            .scattered-photo {
                position: static !important;
                max-width: 55px !important;
                opacity: 1 !important;
                transform: none !important;
                animation: none !important;
                transition: none;
            }

            /* Scattered rotation & floating per photo */
            .photos-left .photo-1 {
                transform: rotate(-5deg) !important;
                animation: float 4s ease-in-out infinite !important;
                animation-delay: 0s !important;
            }
            .photos-left .photo-3 {
                transform: rotate(7deg) !important;
                animation: float 4.5s ease-in-out infinite !important;
                animation-delay: 0.5s !important;
            }
            .photos-left .photo-5 {
                transform: rotate(-3deg) !important;
                animation: float 5s ease-in-out infinite !important;
                animation-delay: 1s !important;
            }
            .photos-right .photo-2 {
                transform: rotate(4deg) !important;
                animation: float 4.2s ease-in-out infinite !important;
                animation-delay: 0.3s !important;
            }
            .photos-right .photo-4 {
                transform: rotate(-6deg) !important;
                animation: float 4.8s ease-in-out infinite !important;
                animation-delay: 0.8s !important;
            }
            .photos-right .photo-6 {
                transform: rotate(5deg) !important;
                animation: float 5.2s ease-in-out infinite !important;
                animation-delay: 1.3s !important;
            }
        }

        @media (max-width: 480px) {
            .scattered-photo {
                max-width: 45px !important;
            }
            .photos-left, .photos-right {
                gap: 6px;
            }
        }

        @media (max-width: 380px) {
            .scattered-photo {
                max-width: 38px !important;
            }
        }

        /* Apply floating to photos too, but only when active */
        .screen.active .scattered-photo {
            animation: float 5s ease-in-out infinite alternate;
        }

        .photo-1 { animation-delay: 0s; }
        .photo-2 { animation-delay: 0.5s; }
        .photo-3 { animation-delay: 1s; }
        .photo-4 { animation-delay: 1.5s; }
        .photo-5 { animation-delay: 2s; }
        .photo-6 { animation-delay: 2.5s; }

        .apple-button {
            background: white;
            color: black;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        @media (max-width: 768px) {
            .apple-button {
                padding: 12px 32px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .apple-button {
                padding: 10px 24px;
                font-size: 0.9rem;
            }
        }

        .nav-buttons {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .nav-buttons {
                bottom: 25px;
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .nav-buttons {
                bottom: calc(15px + env(safe-area-inset-bottom, 0px));
                gap: 12px;
            }
        }

        .back-button {
            background: var(--glass-bg);
            color: white;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
        }

        .apple-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .apple-button:active {
            transform: scale(0.95);
        }

        /* Page 4: Birthday Candles */
        .candles-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            padding: 10px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .candles-container {
                gap: 12px;
                padding: 5px;
            }

            .candles-container .page-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .candles-container {
                gap: 8px;
            }

            .candles-container .page-title {
                font-size: 1.2rem;
            }

            .instructions {
                font-size: 0.75rem;
                max-width: 200px;
            }
        }

        .candles-container .page-title {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: -0.5px;
            margin-top: 10px;
        }

        .webcam-container {
            position: relative;
            width: 300px;
            height: 225px;
            border-radius: 12px;
            overflow: hidden;
            background: black;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .webcam-container {
                width: 260px;
                height: 195px;
            }
        }

        @media (max-width: 480px) {
            .webcam-container {
                width: 220px;
                height: 165px;
            }
        }

        @media (max-width: 380px) {
            .webcam-container {
                width: 180px;
                height: 135px;
            }
        }

        #webcam {
            display: none;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .cake-area {
            position: relative;
            width: 500px;
            max-width: 90vw;
            height: 330px;
            max-height: 35vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cake-bg {
            position: absolute;
            width: 500px;
            max-width: 100%;
            height: auto;
        }

        .cake {
            position: absolute;
            width: 160px;
            max-width: 30%;
            z-index: 5;
        }

        .match {
            position: absolute;
            width: 40px;
            max-width: 8%;
            pointer-events: none;
            transition: left 0.05s ease-out, top 0.05s ease-out;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .cake-area {
                width: 85vw;
                height: 280px;
                max-height: 30vh;
            }

            .cake {
                width: 120px;
            }

            .match {
                width: 32px;
            }
        }

        @media (max-width: 480px) {
            .cake-area {
                width: 90vw;
                height: 220px;
                max-height: 28vh;
            }

            .cake {
                width: 90px;
            }

            .match {
                width: 28px;
            }
        }

        @media (max-width: 380px) {
            .cake-area {
                height: 180px;
            }

            .cake {
                width: 70px;
            }

            .match {
                width: 24px;
            }
        }

        .instructions {
            font-size: 0.9rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            max-width: 250px;
        }

        @media (max-width: 768px) {
            .instructions {
                font-size: 0.8rem;
            }
        }

        /* Final Screen */
        .final-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            height: 100%;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .final-container {
                gap: 25px;
            }
        }

        @media (max-width: 480px) {
            .final-container {
                gap: 15px;
            }
        }

        #final-image {
            max-width: 90%;
            max-height: 70vh;
            width: auto;
            height: auto;
        }

        @media (max-width: 768px) {
            #final-image {
                max-width: 95%;
                max-height: 60vh;
            }
        }

        @media (max-width: 480px) {
            #final-image {
                max-width: 98%;
                max-height: 55vh;
            }
        }

        /* Confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent-color);
            top: -20px;
            opacity: 0.7;
            border-radius: 2px;
        }

        /* Prevent zoom on iOS when tapping inputs */
        input, button, textarea, select {
            font-size: 16px;
        }

        /* Smooth scrolling for mobile */
        @media (max-width: 768px) {
            body {
                -webkit-overflow-scrolling: touch;
            }

            .left-side {
                height: auto;
                flex: 0 0 auto;
            }

            .left-side .polaroid-hero {
                max-height: 200px;
            }
        }

        @media (max-width: 480px) {
            .left-side .polaroid-hero {
                max-height: 160px;
            }
        }

        @media (max-width: 380px) {
            .left-side .polaroid-hero {
                max-height: 130px;
            }
        }

        /* Hide polaroid on short screens to give keypad more room */
        @media (max-height: 650px) {
            .left-side {
                display: none;
            }

            .split-layout {
                height: 100%;
                padding-top: 0;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Page 1: Password Entry Screen -->
        <section id="password-screen" class="screen active">
            <div class="split-layout">
                <div class="left-side">
                    <img src="assets/polaroid.png" alt="Polaroid" class="floating polaroid-hero">
                </div>
                <div class="right-side">
                    <div class="login-container">
                        <h1>ENTER A PASSCODE</h1>
                        <div id="password-dots" class="dots-container">
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                            <span class="dot"></span>
                        </div>
                        <div class="keypad">
                            <button class="key">1</button>
                            <button class="key">2</button>
                            <button class="key">3</button>
                            <button class="key">4</button>
                            <button class="key">5</button>
                            <button class="key">6</button>
                            <button class="key">7</button>
                            <button class="key">8</button>
                            <button class="key">9</button>
                            <button class="key" id="delete-btn">⌫</button>
                            <button class="key">0</button>
                            <button class="key" id="enter-btn">✓</button>
                        </div>
                        <div class="hint-container">
                            <button id="hint-btn" class="text-button">Need a hint?</button>
                            <p id="hint-text" class="hidden">Hint: Your birthday!</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Loading Screen -->
        <section id="loading-screen" class="screen">
            <div class="loading-content">
                <h2>Loading your surprise...</h2>
                <div class="progress-container glass-card">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </section>

        <!-- Page 2: Envelope Reveal -->
        <section id="envelope-screen" class="screen">
            <div class="envelope-container">
                <div id="envelope-wrapper" class="floating">
                    <img src="assets/envelope.png" alt="Envelope" id="envelope-img">
                </div>
                <p class="label">Click to Open</p>
                <div class="nav-buttons envelope-nav">
                    <button class="apple-button back-button" onclick="goBack()">Back</button>
                </div>
            </div>
        </section>

        <!-- Page 3: Birthday Letter -->
        <section id="letter-screen" class="screen">
            <div class="scrapbook-container">
                <div class="photos-left">
                    <img src="assets/scattered-image-1.png" alt="Photo 1" class="scattered-photo photo-1">
                    <img src="assets/scattered-image-3.png" alt="Photo 3" class="scattered-photo photo-3">
                    <img src="assets/scattered-image-5.png" alt="Photo 5" class="scattered-photo photo-5">
                </div>
                
                <div class="main-card-wrapper">
                    <img src="assets/bday card.jpg" alt="Birthday Card" id="bday-card" class="bday-card">
                </div>

                <div class="photos-right">
                    <img src="assets/scattered-image-2.png" alt="Photo 2" class="scattered-photo photo-2">
                    <img src="assets/scattered-image-4.png" alt="Photo 4" class="scattered-photo photo-4">
                    <img src="assets/scattered-image-6.png" alt="Photo 6" class="scattered-photo photo-6">
                </div>
            </div>
            <div class="nav-buttons">
                <button class="apple-button back-button" onclick="goBack()">Back</button>
                <button id="next-button" class="apple-button" onclick="goToNextPage()">Next</button>
            </div>
        </section>

        <!-- Page 4: Birthday Candles -->
        <section id="candles-screen" class="screen">
            <div class="candles-container">
                <h2 class="page-title">Make a Wish</h2>
                <div class="webcam-container">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                </div>
                <div class="cake-area">
                    <img src="other-assets/cake_bg.png" alt="" class="cake-bg">
                    <img src="other-assets/cake_unlit.gif" alt="" class="cake">
                    <img src="other-assets/match.gif" alt="" class="match">
                </div>
                <p class="instructions">Use your hand to light the cake, then blow out the candles!</p>
            </div>
        </section>

        <!-- Final Page -->
        <section id="final-screen" class="screen">
            <div class="final-container">
                <img src="assets/final-image.jpg" alt="Surprise!" id="final-image">
                <div class="nav-buttons">
                    <button class="apple-button" onclick="restartApp()">Restart</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Confetti Container -->
    <div id="confetti-canvas"></div>

    <script>
        // Configuration
        const CONFIG = {
            password: "1006", // Change this to your desired password
            loadingDuration: 3500, // Duration in ms
            assets: [
                'assets/polaroid.png',
                'assets/envelope.png',
                'assets/bday card.jpg',
                'assets/scattered-image-1.png',
                'assets/scattered-image-2.png',
                'assets/scattered-image-3.png',
                'assets/scattered-image-4.png',
                'assets/scattered-image-5.png',
                'assets/scattered-image-6.png',
                'other-assets/cake_bg.png',
                'other-assets/cake_unlit.gif',
                'other-assets/cake_lit.gif',
                'other-assets/match.gif',
                'assets/final-image.jpg'
            ]
        };

        // State
        let currentPassword = "";
        let isTransitioning = false;
        let screenHistory = ['password'];

        // DOM Elements
        const screens = {
            password: document.getElementById('password-screen'),
            loading: document.getElementById('loading-screen'),
            envelope: document.getElementById('envelope-screen'),
            letter: document.getElementById('letter-screen'),
            candles: document.getElementById('candles-screen'),
            final: document.getElementById('final-screen')
        };

        const passwordDots = document.querySelectorAll('.dot');
        const keypadKeys = document.querySelectorAll('.key');
        const progressBar = document.getElementById('progress-bar');
        const envelopeWrapper = document.getElementById('envelope-wrapper');
        const envelopeScreen = document.getElementById('envelope-screen');

        // Candles DOM
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const match = document.querySelector(".match");
        const cakeArea = document.querySelector(".cake-area");
        const cakeImg = document.querySelector(".cake");

        // Candles Constants
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const WEBCAM_WIDTH = isMobile ? 240 : 300;
        const WEBCAM_HEIGHT = isMobile ? 180 : 225;
        const BLOW_THRESHOLD = 70; 
        const LIGHT_DISTANCE = 30;

        // Candles State
        let handPosition = { x: 0.5, y: 0.5 };
        let isHandDetected = false;
        let isCakeLit = false;
        let isCandlesBlownOut = false;
        let mediaPipeActive = false;
        let blowDetectionActive = false;

        // Initialize
        function init() {
            preloadAssets();
            setupKeypad();
            setupEnvelope();
            setupHint();
        }

        function setupHint() {
            const hintBtn = document.getElementById('hint-btn');
            const hintText = document.getElementById('hint-text');
            if (hintBtn && hintText) {
                hintBtn.addEventListener('click', () => {
                    hintText.classList.toggle('hidden');
                    hintBtn.innerText = hintText.classList.contains('hidden') ? 'Need a hint?' : 'Hide hint';
                });
            }
        }

        // Asset Preloading
        function preloadAssets() {
            CONFIG.assets.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        }

        // State Management
        function switchScreen(screenName, isBack = false) {
            if (isTransitioning) return;
            isTransitioning = true;

            // Remove active class from all screens
            Object.values(screens).forEach(screen => {
                screen.classList.remove('active');
            });

            if (!isBack) {
                screenHistory.push(screenName);
            }

            // Add active class to target screen
            setTimeout(() => {
                screens[screenName].classList.add('active');
                isTransitioning = false;
                
                // Trigger screen-specific logic
                if (screenName === 'loading') {
                    startLoading();
                }
                
                // Reset envelope state if going back to it
                if (screenName === 'envelope') {
                    envelopeScreen.classList.remove('opening');
                }

                if (screenName === 'candles') {
                    initCandlesExperience();
                }
            }, 50);
        }

        function goBack() {
            if (screenHistory.length <= 1 || isTransitioning) return;
            
            // Remove current screen
            screenHistory.pop();
            // Get previous screen
            const previousScreen = screenHistory[screenHistory.length - 1];
            
            // Transition back
            switchScreen(previousScreen, true);
        }

        // Password Logic
        function setupKeypad() {
            keypadKeys.forEach(key => {
                key.addEventListener('click', () => {
                    const val = key.innerText;
                    
                    if (val === '⌫') {
                        currentPassword = currentPassword.slice(0, -1);
                    } else if (val === '✓') {
                        validatePassword();
                    } else if (currentPassword.length < 4) {
                        currentPassword += val;
                    }
                    
                    updateDots();
                });
            });
        }

        function updateDots() {
            passwordDots.forEach((dot, index) => {
                if (index < currentPassword.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function validatePassword() {
            if (currentPassword === CONFIG.password) {
                triggerConfetti();
                setTimeout(() => switchScreen('loading'), 1000);
            } else {
                // Shake animation for error
                const container = document.querySelector('.login-container');
                container.style.animation = 'shake 0.5s ease';
                setTimeout(() => {
                    container.style.animation = '';
                    currentPassword = "";
                    updateDots();
                }, 500);
            }
        }

        // Loading Logic
        function startLoading() {
            let progress = 0;
            const interval = 30; // ms
            const step = 100 / (CONFIG.loadingDuration / interval);

            const loadingInterval = setInterval(() => {
                progress += step;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);
                    setTimeout(() => switchScreen('envelope'), 500);
                }
                progressBar.style.width = `${progress}%`;
            }, interval);
        }

        // Envelope Logic
        function setupEnvelope() {
            envelopeWrapper.addEventListener('click', () => {
                envelopeScreen.classList.add('opening');
                setTimeout(() => switchScreen('letter'), 600);
            });
        }

        // Confetti Effect
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            for (let i = 0; i < 50; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.backgroundColor = ['#4ade80', '#ffffff', '#22c55e'][Math.floor(Math.random() * 3)];
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                canvas.appendChild(piece);

                const animation = piece.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${(Math.random() - 0.5) * 200}px, 100vh, 0) rotate(${Math.random() * 1000}deg)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 2000,
                    easing: 'cubic-bezier(0, .9, .57, 1)',
                    delay: Math.random() * 200
                });

                animation.onfinish = () => piece.remove();
            }
        }

        // Navigation
        function goToNextPage() {
            switchScreen('candles');
        }

        function restartApp() {
            // Reset states
            currentPassword = "";
            isCakeLit = false;
            isCandlesBlownOut = false;
            cakeImg.src = "other-assets/cake_unlit.gif";
            match.style.display = "block";
            updateDots();
            
            // Switch to password screen
            screenHistory = ['password'];
            switchScreen('password', true);
        }

        // Candles Experience
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: isMobile ? 0 : 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.5,
        });

        hands.onResults((results) => {
            if (!screens.candles.classList.contains('active')) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(results.image, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                isHandDetected = true;
                const indexTip = landmarks[8];
                handPosition.x = 1 - indexTip.x;
                handPosition.y = indexTip.y;
                updateMatchPosition();
                checkCandleLighting();
            } else {
                isHandDetected = false;
            }
        });

        function initCandlesExperience() {
            if (mediaPipeActive) return;
            mediaPipeActive = true;

            canvas.width = WEBCAM_WIDTH;
            canvas.height = WEBCAM_HEIGHT;

            initCamera();
            initBlowDetection();
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: WEBCAM_WIDTH, height: WEBCAM_HEIGHT, facingMode: "user" }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    const camera = new Camera(video, {
                        onFrame: async () => { await hands.send({ image: video }); },
                        width: WEBCAM_WIDTH, height: WEBCAM_HEIGHT
                    });
                    camera.start();
                };
            } catch (err) {
                console.error("Webcam error:", err);
            }
        }

        function updateMatchPosition() {
            if (!isHandDetected) return;
            const cakeRect = cakeArea.getBoundingClientRect();
            const padding = 20;
            const matchX = padding + handPosition.x * (cakeRect.width - padding * 2 - 40);
            const matchY = padding + handPosition.y * (cakeRect.height - padding * 2 - 60);
            match.style.left = `${matchX}px`;
            match.style.top = `${matchY}px`;
        }

        function checkCandleLighting() {
            if (isCakeLit || isCandlesBlownOut) return;
            const matchRect = match.getBoundingClientRect();
            const cakeRect = cakeImg.getBoundingClientRect();
            const matchTipX = matchRect.left + matchRect.width / 2;
            const matchTipY = matchRect.top;
            const candleX = cakeRect.left + cakeRect.width / 2;
            const candleY = cakeRect.top + 10;
            const distance = Math.sqrt(Math.pow(matchTipX - candleX, 2) + Math.pow(matchTipY - candleY, 2));
            if (distance < LIGHT_DISTANCE) lightCake();
        }

        function lightCake() {
            isCakeLit = true;
            cakeImg.src = "other-assets/cake_lit.gif";
            match.style.display = "none";
        }

        let audioContext, analyser, microphone;
        async function initBlowDetection() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                analyser.fftSize = 256;
                microphone.connect(analyser);
                blowDetectionActive = true;
                detectBlow();
            } catch (err) {
                console.error("Mic error:", err);
            }
        }

        function detectBlow() {
            if (!blowDetectionActive || isCandlesBlownOut) return;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            const volume = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
            if (volume > BLOW_THRESHOLD && isCakeLit) {
                blowOutCandles();
                return;
            }
            requestAnimationFrame(detectBlow);
        }

        function blowOutCandles() {
            isCandlesBlownOut = true;
            cakeImg.src = "other-assets/cake_unlit.gif";
            triggerConfetti();
            setTimeout(() => switchScreen('final'), 3000);
        }

        // Run init
        document.addEventListener('DOMContentLoaded', init);

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            // Only process keyboard input if the password screen is active
            if (!screens.password.classList.contains('active')) return;

            if (e.key >= '0' && e.key <= '9') {
                if (currentPassword.length < 4) {
                    currentPassword += e.key;
                    updateDots();
                }
            } else if (e.key === 'Backspace') {
                currentPassword = currentPassword.slice(0, -1);
                updateDots();
            } else if (e.key === 'Enter') {
                validatePassword();
            }
        });
    </script>
</body>
</html>
